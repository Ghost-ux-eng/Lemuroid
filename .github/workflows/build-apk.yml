name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Dar permissão ao gradlew
        run: chmod +x gradlew

      - name: Compilar APK de teste
        run: ./gradlew assembleFreeBundleDebug

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: meu-emulador-apk
          path: lemuroid-app/build/outputs/apk/**/*.apk
